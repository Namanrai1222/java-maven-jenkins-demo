<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact form</title>
  <style>
    :root {
      --ink: #202b33;
      --muted: #53616b;
      --paper: #ffffff;
      --background: #eef2f1;
      --border: #8b9a9d;
      --accent: #205b63;
      --accent-hover: #17464d;
      --font-body: 'Trebuchet MS', Tahoma, sans-serif;
      --font-heading: Georgia, 'Times New Roman', serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-width: 0; overflow-x: clip; }
    body {
      min-height: 100vh;
      padding: 3rem 1rem;
      background: var(--background);
      color: var(--ink);
      font-family: var(--font-body);
      line-height: 1.5;
    }
    main {
      width: min(100%, 34rem);
      margin: 0 auto;
      padding: clamp(1.5rem, 5vw, 3rem);
      background: var(--paper);
      border-top: 0.35rem solid var(--accent);
    }
    h1 {
      margin: 0 0 0.5rem;
      font-family: var(--font-heading);
      font-size: clamp(2rem, 6vw, 2.7rem);
      font-weight: 400;
      line-height: 1.15;
      overflow-wrap: anywhere;
    }
    p { margin: 0 0 2rem; color: var(--muted); }
    .field { margin-bottom: 1.5rem; }
    label { display: block; margin-bottom: 0.4rem; font-weight: 700; }
    input {
      display: block;
      width: 100%;
      min-height: 2.8rem;
      padding: 0.65rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 0;
      background: var(--paper);
      color: var(--ink);
      font: inherit;
    }
    input:focus-visible, button:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }
    button {
      min-height: 2.8rem;
      padding: 0.6rem 1.5rem;
      border: 0;
      background: var(--accent);
      color: var(--paper);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: var(--accent-hover); }
    button:active { transform: translateY(1px); }
    #form-status { margin: 1rem 0 0; color: var(--ink); }
    #form-status:empty { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>Contact form</h1>
    <p>Enter your details below. All fields are required.</p>
    <form id="contact-form">
      <div class="field">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="contact-number">Contact Number</label>
        <input id="contact-number" name="contactNumber" type="tel" autocomplete="tel" required>
      </div>
      <button type="submit">Submit</button>
      <p id="form-status" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script>
    document.getElementById('contact-form').addEventListener('submit', function (event) {
      event.preventDefault();
      document.getElementById('form-status').textContent = 'Form checked. This demo does not send your details.';
    });
  </script>
</body>
</html>
